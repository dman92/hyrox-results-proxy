name: Ingesta HYROX

# Vuelca los listados de results.hyrox.com a la base de datos (secret DATABASE_URL).
# Cada ejecución trabaja ~4,5 h como mucho y la siguiente sigue donde lo dejó, así que
# la carga inicial se completa sola en varias ejecuciones. Cuando ya está todo, cada
# ejecución tarda 1-2 min: solo añade carreras nuevas y refresca las recientes.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Temporadas, separadas por espacios'
        default: '7 8 9'
      max_events:
        description: 'Máximo de eventos por temporada (vacío = todos; pon 2 para probar)'
        default: ''
      max_minutes:
        description: 'No empezar eventos nuevos pasados estos minutos'
        default: '270'

# Nunca dos a la vez: se pisarían el checkpoint y duplicarían peticiones.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ingesta
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEASONS: ${{ inputs.seasons || '7 8 9' }}
          MAX_EVENTS: ${{ inputs.max_events }}
          MAX_MINUTES: ${{ inputs.max_minutes || '270' }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Falta el secret DATABASE_URL (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          args="--max-minutes $MAX_MINUTES"
          for s in $SEASONS; do args="$args --season $s"; done
          if [ -n "$MAX_EVENTS" ]; then args="$args --max-events $MAX_EVENTS"; fi
          node --experimental-strip-types scripts/ingest.ts $args
